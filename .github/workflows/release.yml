name: Release

# Inlined from zotero-plugin-dev/workflows (no recursive submodules).
# Compare: https://github.com/zotero-plugin-dev/workflows/blob/main/.github/workflows/release-plugin.yml

on:
  push:
    tags:
      - V**

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-release:
    name: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:release

      - name: Release
        run: npm run release -- -y
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
